### THREAD / TIMELINE (thread.dryark.uk)
# Main reverse proxy configuration for greenstreet (Raspberry Pi at 100.97.26.113:3001)
# Include / extend into: oz.urawizard.com/nginx-all/app.conf

server {
    listen 443 ssl;
    server_name thread.dryark.uk;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/dryark.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dryark.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    location / {
        proxy_pass         http://100.97.26.113:3001;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_redirect     off;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    location /socket.io/ {
        proxy_pass         http://100.97.26.113:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_redirect     off;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }
}
