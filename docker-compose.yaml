services:
  timeline:
    container_name: timeline
    image: timeline:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    network_mode: host
    environment:
      - PORT=3001
      - DATABASE_PATH=/app/data/timeline.db
      - RAUTHY_URL=https://identity.dryark.uk
      - RAUTHY_INTERNAL_URL=http://127.0.0.1:8085
      - OIDC_CLIENT_ID=thread-web
      - OIDC_CLIENT_SECRET=cb2d9d9b89e03f3c701582f2ed75493dbc1406e3432d6814aa1b090f67330fe7
      - APP_URL=https://thread.dryark.uk
      - SECRET_KEY=timeline-production-session-key-2026
      - MONMON_URL=http://127.0.0.1:9000
    volumes:
      - ./data:/app/data

  mood-gen:
    container_name: mood-gen
    image: mood-gen:latest
    build:
      context: .
      dockerfile: mood-gen/Dockerfile
    restart: unless-stopped
    mem_limit: 1800m
    cpus: "2.0"
    environment:
      - DATABASE_PATH=/app/data/timeline.db
      - IMAGES_DIR=/app/data/mood_images
      - MODEL_PATH=/app/data/models/sd-turbo-q4_0.gguf
      - MODEL_URL=https://huggingface.co/gpustack/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-Q4_0.gguf
      - INTER_JOB_SLEEP_SECONDS=8
      - SD_THREADS=2
    volumes:
      - ./data:/app/data
